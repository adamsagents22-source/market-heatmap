name: Update heatmap

on:
  schedule:
    # Every 10 min, Mon–Fri, 13:00–21:59 UTC (covers US market hours year-round)
    - cron: "*/10 13-21 * * 1-5"
  workflow_dispatch:      # "Run workflow" button for a manual refresh
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests yfinance pandas
      - name: Fetch market data
        env:
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          MAX_STOCKS: "2500"
        run: python scripts/fetch_data.py
      - name: Fetch earnings, IPOs and news
        continue-on-error: true   # a hiccup here must never block the heatmap itself
        env:
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python scripts/fetch_events.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
